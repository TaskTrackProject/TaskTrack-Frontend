<nz-layout class="app-layout">

  <!-- Navbar -->
  <nz-header class="app-header">

    <div class="header-container">

      <!-- Logo -->
      <a
        routerLink="/"
        class="logo">

        <span
          nz-icon
          nzType="check-circle"
          nzTheme="fill">
        </span>

        <span>TaskTrack</span>

      </a>


      <!-- Navigation -->
      <nav class="navigation">

        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">

          <span
            nz-icon
            nzType="home">
          </span>

          <span>Home</span>

        </a>


        <a
          routerLink="/departments"
          routerLinkActive="active">

          <span
            nz-icon
            nzType="apartment">
          </span>

          <span>Departments</span>

        </a>


        <a
          routerLink="/projects"
          routerLinkActive="active">

          <span
            nz-icon
            nzType="project">
          </span>

          <span>Projects</span>

        </a>


        <a
          routerLink="/tasks"
          routerLinkActive="active">

          <span
            nz-icon
            nzType="check-square">
          </span>

          <span>Tasks</span>

        </a>


        <a
          routerLink="/tags"
          routerLinkActive="active">

          <span
            nz-icon
            nzType="tags">
          </span>

          <span>Tags</span>

        </a>


        <a
          routerLink="/search"
          routerLinkActive="active">

          <span
            nz-icon
            nzType="search">
          </span>

          <span>Search</span>

        </a>

      </nav>

    </div>

  </nz-header>


  <!-- Main -->
  <nz-content class="app-content">

    <main class="content-container">

      <router-outlet />

    </main>

  </nz-content>


  <!-- Footer -->
  <nz-footer class="app-footer">

    <span>
      TaskTrack © 2026
    </span>

  </nz-footer>

</nz-layout>
